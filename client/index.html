<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <!-- FOUC Prevention: Apply saved theme BEFORE any rendering -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sentron-theme');
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          // Default is light — no attribute needed (CSS defaults to light tokens)
        } catch(e) {}
      })();
    </script>

    <title>Sentron Asia International — Scientific & Laboratory Equipment</title>
    <meta name="description" content="Sentron Asia International is a leading supplier of scientific, laboratory, and analytical equipment across Asia with 40+ years of trusted experience." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
